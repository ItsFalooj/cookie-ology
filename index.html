<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookie-Ology</title>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="assets/cookieology-logo.png" alt="Cookie-Ology" />
      </a>

      <a href="aboutus.html" class="hrefaboutus">About us</a>
      <a href="cookies.html" class="hrefcookies">Cookies!</a>
      <button class="nav-button">Order now!</button>
    </nav>

    <!-- Main content -->
    <div class="wrapper">
      <main class="section">
        <!-- Hero -->
        <div class="hero">
          <div class="hero-content">
            <h1 class="hero-header">Get Fresh Cookies</h1>

            <p class="hero-p">
              Our business is dedicated to feeding you the best, most delicious and melt in your
              mouth cookies. Order now to get the best options.
            </p>

            <button class="hero-button">Order now!</button>
          </div>
        </div>

        <!-- Cookie boxes -->
        <div class="cookie1">
          <img src="./assets/cookie1.png" alt="Chocolate chip cookie" />
        </div>

        <div class="cookie2">
          <img src="./assets/cookie2.png" alt="Chocolate cookie" />
        </div>

        <div class="cookie3">
          <img src="./assets/cookie3.png" alt="Vanilla cookie" />
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="license.html" class="licensing">Our licensing</a>
      <a href="https://maps.google.com" class="googlemaps">Google Maps</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
